<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florr.io - One Person</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
        }
        .slot {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .slot:hover {
            border-color: #4CAF50;
        }
        .petal-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .rarity-common { background: #b0b0b0; color: black; }
        .rarity-unusual { background: #55ff55; color: black; }
        .rarity-rare { background: #5555ff; color: white; }
        
        .count-badge {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 11px;
            background: rgba(0,0,0,0.8);
            padding: 1px 3px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="ui">
        Счет: <span id="score">0</span><br>
        Здоровье: <span id="hp">100</span>/100
    </div>

    <div id="inventory">
        <div class="slot" onclick="craftPetal(0)"><div class="count-badge" id="count-0">0</div></div>
        <div class="slot" onclick="craftPetal(1)"><div class="count-badge" id="count-1">0</div></div>
        <div class="slot" onclick="craftPetal(2)"><div class="count-badge" id="count-2">0</div></div>
        <div class="slot" onclick="craftPetal(3)"><div class="count-badge" id="count-3">0</div></div>
        <div class="slot" onclick="craftPetal(4)"><div class="count-badge" id="count-4">0</div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 25,
            speed: 3.5,
            hp: 100,
            maxHp: 100,
            score: 0
        };

        let petals = [
            { angle: 0, distance: 45, radius: 12, speed: 0.05, hp: 30, maxHp: 30, rarity: 0 },
            { angle: Math.PI / 2, distance: 45, radius: 12, speed: 0.05, hp: 30, maxHp: 30, rarity: 0 },
            { angle: Math.PI, distance: 45, radius: 12, speed: 0.05, hp: 30, maxHp: 30, rarity: 0 },
            { angle: (3 * Math.PI) / 2, distance: 45, radius: 12, speed: 0.05, hp: 30, maxHp: 30, rarity: 0 }
        ];

        let inventory = [
            { rarity: 0, count: 5 },
            { rarity: 0, count: 0 },
            { rarity: 0, count: 0 },
            { rarity: 0, count: 0 },
            { rarity: 0, count: 0 }
        ];

        let mobs = [];
        let drops = [];

        const rarityColors = ["#b0b0b0", "#55ff55", "#5555ff"];

        function spawnMob() {
            if (mobs.length < 8) {
                let angle = Math.random() * Math.PI * 2;
                let distance = Math.max(canvas.width, canvas.height) / 2 + 100;
                let type = Math.random() > 0.3 ? 'ladybug' : 'wasp';
                
                mobs.push({
                    x: player.x + Math.cos(angle) * distance,
                    y: player.y + Math.sin(angle) * distance,
                    radius: type === 'ladybug' ? 20 : 15,
                    hp: type === 'ladybug' ? 40 : 25,
                    maxHp: type === 'ladybug' ? 40 : 25,
                    speed: type === 'ladybug' ? 1.8 : 2.6,
                    color: type === 'ladybug' ? "#ff3b3b" : "#ffcc00"
                });
            }
        }
        setInterval(spawnMob, 2500);

        window.craftPetal = function(index) {
            let item = inventory[index];
            if (item.count >= 5) {
                item.count -= 5;
                if (index < 4) {
                    inventory[index + 1].count += 1;
                    inventory[index + 1].rarity = item.rarity + 1;
                }
                updateInventoryUI();
            }
        };

        function updateInventoryUI() {
            for (let i = 0; i < 5; i++) {
                let slotEl = document.getElementById("inventory").children[i];
                let item = inventory[i];
                let countEl = document.getElementById(`count-${i}`);
                
                countEl.innerText = item.count > 0 ? item.count : "";
                
                if (item.count > 0) {
                    slotEl.innerHTML = `<div class="petal-icon rarity-${getRarityClass(item.rarity)}">Леп</div><div class="count-badge">${item.count}</div>`;
                } else {
                    slotEl.innerHTML = `<div class="count-badge">0</div>`;
                }
            }
        }

        function getRarityClass(rarity) {
            if (rarity === 1) return 'unusual';
            if (rarity === 2) return 'rare';
            return 'common';
        }

        function update() {
            let dx = mouse.x - player.x;
            let dy = mouse.y - player.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 1) {
                player.x += (dx / dist) * Math.min(player.speed, dist);
                player.y += (dy / dist) * Math.min(player.speed, dist);
            }

            petals.forEach((p) => {
                p.angle += p.speed;
            });

            // Безопасный обход мобов с обратным циклом, чтобы избежать зависаний при удалении
            for (let mIndex = mobs.length - 1; mIndex >= 0; mIndex--) {
                let mob = mobs[mIndex];
                let mdx = player.x - mob.x;
                let mdy = player.y - mob.y;
                let mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                
                if (mdist > 1) {
                    mob.x += (mdx / mdist) * mob.speed;
                    mob.y += (mdy / mdist) * mob.speed;
                }

                if (mdist < player.radius + mob.radius) {
                    player.hp -= 0.4;
                    if (player.hp <= 0) {
                        alert("Игра окончена! Счëт: " + player.score);
                        player.hp = 100;
                        player.score = 0;
                        mobs = [];
                        drops = [];
                    }
                }

                let mobDead = false;
                petals.forEach(p => {
                    if (mobDead) return;
                    let px = player.x + Math.cos(p.angle) * p.distance;
                    let py = player.y + Math.sin(p.angle) * p.distance;

                    let pdx = mob.x - px;
                    let pdy = mob.y - py;
                    let pdist = Math.sqrt(pdx * pdx + pdy * pdy);

                    if (pdist < p.radius + mob.radius) {
                        mob.hp -= 15;
                        if (mob.hp <= 0) {
                            drops.push({
                                x: mob.x,
                                y: mob.y,
                                radius: 10,
                                rarity: Math.random() < 0.15 ? 1 : 0
                            });
                            mobs.splice(mIndex, 1);
                            player.score += 15;
                            mobDead = true;
                        }
                    }
                });
            }

            for (let dIndex = drops.length - 1; dIndex >= 0; dIndex--) {
                let drop = drops[dIndex];
                let ddx = player.x - drop.x;
                let ddy = player.y - drop.y;
                let ddist = Math.sqrt(ddx * ddx + ddy * ddy);

                if (ddist < player.radius + drop.radius + 15) {
                    for (let i = 0; i < inventory.length; i++) {
                        if (inventory[i].rarity === drop.rarity || inventory[i].count === 0) {
                            inventory[i].rarity = drop.rarity;
                            inventory[i].count += 1;
                            break;
                        }
                    }
                    drops.splice(dIndex, 1);
                    updateInventoryUI();
                }
            }

            document.getElementById("score").innerText = player.score;
            document.getElementById("hp").innerText = Math.max(0, Math.floor(player.hp));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#222";
            ctx.lineWidth = 1;
            let gridSize = 50;
            let startX = -(player.x % gridSize);
            let startY = -(player.y % gridSize);
            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            drops.forEach(drop => {
                ctx.fillStyle = rarityColors[drop.rarity];
                ctx.beginPath();
                ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            });

            mobs.forEach(mob => {
                ctx.save();
                ctx.translate(mob.x, mob.y);

                ctx.fillStyle = mob.color;
                ctx.beginPath();
                ctx.arc(0, 0, mob.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(-5, -4, 4, 0, Math.PI * 2);
                ctx.arc(5, -4, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(-5, -4, 1.5, 0, Math.PI * 2);
                ctx.arc(5, -4, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                let barWidth = mob.radius * 2;
                let barHeight = 4;
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(mob.x - barWidth / 2, mob.y - mob.radius - 12, barWidth, barHeight);
                
                let hpPercent = Math.max(0, mob.hp / mob.maxHp);
                ctx.fillStyle = "#4CAF50";
                ctx.fillRect(mob.x - barWidth / 2, mob.y - mob.radius - 12, barWidth * hpPercent, barHeight);
            });

            ctx.fillStyle = "#1E88E5";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(player.x - 7, player.y - 5, 5, 0, Math.PI * 2);
            ctx.arc(player.x + 7, player.y - 5, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(player.x - 7, player.y - 5, 2, 0, Math.PI * 2);
            ctx.arc(player.x + 7, player.y - 5, 2, 0, Math.PI * 2);
            ctx.fill();

            petals.forEach(p => {
                let px = player.x + Math.cos(p.angle) * p.distance;
                let py = player.y + Math.sin(p.angle) * p.distance;

                ctx.fillStyle = rarityColors[p.rarity];
                ctx.beginPath();
                ctx.arc(px, py, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        updateInventoryUI();
        loop();
    </script>
</body>
</html>
